name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-test-build:
    name: Lint, Test, and Build Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max complexity 15, max line length 127
          flake8 app tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run automated test suite
        run: |
          pytest --verbose

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t greenleaf-forecast:latest .

      - name: Smoke test container locally
        run: |
          # Run container in detached mode on port 8000
          docker run -d --name test-forecast-app -p 8000:8000 greenleaf-forecast:latest
          # Wait for container startup
          sleep 5
          # Verify health endpoint returns HTTP 200
          curl -f http://localhost:8000/health || (docker logs test-forecast-app && exit 1)
          # Stop and remove test container
          docker stop test-forecast-app
          docker rm test-forecast-app

      - name: Log in to Docker Hub (Conditional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub (Conditional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          docker tag greenleaf-forecast:latest ${{ secrets.DOCKERHUB_USERNAME }}/greenleaf-forecast:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/greenleaf-forecast:latest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
